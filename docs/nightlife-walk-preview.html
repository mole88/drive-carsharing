<!doctype html>
<html lang="ru">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ходьба персонажей</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px;
      background: #101628;
      color: #f9eef8;
      font:
        16px system-ui,
        sans-serif;
    }
    main {
      max-width: 1152px;
      margin: auto;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 10px;
    }
    p {
      color: #b7c0d7;
      margin: 0 0 18px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }
    button {
      padding: 9px 15px;
      border: 1px solid #687698;
      border-radius: 8px;
      background: #29324b;
      color: #fff;
      font: inherit;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      background: #1e2941;
    }
    .names {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      color: #dce1ec;
      margin: 12px 0;
      font-size: 14px;
    }
  </style>
  <main>
    <h1>Ходьба · гламур нулевых</h1>
    <p>Полный цикл шага, разворот и игровой размер.</p>
    <div class="controls">
      <button id="play" type="button">Пауза</button>
      <button id="direction" type="button">Развернуть</button>
      <label
        >Темп
        <input id="tempo" type="range" min="0" max="2" step="0.1" value="1"
      /></label>
      <span id="frame"></span>
    </div>
    <div class="names">
      <span>Розовый</span><span>Леопард</span><span>Бирюза</span
      ><span>Золото · VIP</span>
    </div>
    <canvas id="preview" width="1152" height="700"></canvas>
  </main>
  <script src="../app/static/game-art.js"></script>
  <script>
    const canvas = document.getElementById("preview");
    const ctx = canvas.getContext("2d");
    const names = [
      "blonde-pink",
      "brunette-leopard",
      "redhead-turquoise",
      "vip-gold",
    ];
    let time = 0,
      previous = 0,
      playing = true,
      direction = 1;
    const tempo = document.getElementById("tempo");
    const targets = names.map((name, i) => ({
      x: 144 + i * 288,
      y: 272,
      hue: i * 120,
      vip: i === 3,
      dir: 1,
      stride: i * 0.3,
      state: "walking",
      alpha: 1,
      scale: 1,
      spin: 0,
      speed: 70,
    }));
    document.getElementById("play").onclick = function () {
      playing = !playing;
      this.textContent = playing ? "Пауза" : "Продолжить";
    };
    document.getElementById("direction").onclick = () => {
      direction *= -1;
    };
    window.previewReady = Promise.all(
      names.map(
        (name) =>
          new Promise((resolve, reject) => {
            const im = new Image();
            im.onload = resolve;
            im.onerror = () => reject(new Error("Missing " + name));
            im.src =
              "../app/static/images/sprites/nightlife/" + name + "-walk.webp";
          }),
      ),
    );
    window.renderWalkPreview = function (phase) {
      const gradient = ctx.createLinearGradient(0, 0, 0, 700);
      gradient.addColorStop(0, "#26314c");
      gradient.addColorStop(1, "#131c30");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 1152, 700);
      ctx.strokeStyle = "#ffffff15";
      ctx.lineWidth = 2;
      [288, 576, 864].forEach((x) => {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 700);
        ctx.stroke();
      });
      targets.forEach((target, i) => {
        target.stride = phase + i * 0.3;
        target.dir = direction;
        target.speed = Number(tempo.value) * 70;
        GameArt.target(ctx, target, { scale: 2.7, time: phase });
        GameArt.target(
          ctx,
          { ...target, x: target.x - 65, y: 548 },
          { scale: 1, time: phase },
        );
        GameArt.target(
          ctx,
          { ...target, x: target.x + 65, y: 548, dir: -direction },
          { scale: 1, time: phase },
        );
      });
      ctx.textAlign = "center";
      ctx.font = "15px system-ui";
      ctx.fillStyle = "#b7c0d7";
      targets.forEach((target) =>
        ctx.fillText("игровой размер · оба направления", target.x, 645),
      );
      document.getElementById("frame").textContent =
        "Кадр " +
        (Math.floor(
          ((((phase % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2)) /
            (Math.PI * 2)) *
            8,
        ) +
          1) +
        " / 8";
    };
    function tick(now) {
      if (previous && playing)
        time +=
          Math.min((now - previous) / 1000, 0.05) *
          Number(tempo.value) *
          Math.PI *
          2;
      previous = now;
      window.renderWalkPreview(time);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</html>
